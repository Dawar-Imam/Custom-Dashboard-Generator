<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic Tac Toe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');
  * {
    box-sizing: border-box;
  }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: #fff;
    user-select: none;
  }
  .container {
    background: #2c2c54;
    border-radius: 20px;
    padding: 30px 40px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    width: 350px;
    text-align: center;
  }
  h1 {
    margin-bottom: 15px;
    letter-spacing: 2px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 25px 0 20px;
  }
  .cell {
    background: #474787;
    border-radius: 15px;
    height: 100px;
    font-size: 3.5rem;
    color: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: inset 0 0 10px #2f2f6e;
    transition: background 0.3s ease, transform 0.2s ease;
  }
  .cell:hover {
    background: #5a5ac9;
    transform: scale(1.05);
  }
  .cell.disabled {
    cursor: default;
    background: #3a3a7a;
    box-shadow: none;
    transform: none;
  }
  .status {
    font-size: 1.2rem;
    min-height: 28px;
    margin-bottom: 15px;
    letter-spacing: 1px;
  }
  button {
    background: #764ba2;
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(118,75,162,0.6);
    transition: background 0.3s ease;
  }
  button:hover {
    background: #8e6fcf;
  }
  .highlight {
    background: #f9ca24 !important;
    color: #2f3640 !important;
    box-shadow: 0 0 15px #f9ca24;
  }
</style>
</head>
<body>
  <div class="container" role="main" aria-label="Tic Tac Toe Game">
    <h1>Tic Tac Toe</h1>
    <div class="status" aria-live="polite" id="status">Player X's turn</div>
    <div class="board" role="grid" aria-label="Tic Tac Toe Board">
      <div class="cell" role="gridcell" tabindex="0" data-index="0" aria-label="Cell 1"></div>
      <div class="cell" role="gridcell" tabindex="0" data-index="1" aria-label="Cell 2"></div>
      <div class="cell" role="gridcell" tabindex="0" data-index="2" aria-label="Cell 3"></div>
      <div class="cell" role="gridcell" tabindex="0" data-index="3" aria-label="Cell 4"></div>
      <div class="cell" role="gridcell" tabindex="0" data-index="4" aria-label="Cell 5"></div>
      <div class="cell" role="gridcell" tabindex="0" data-index="5" aria-label="Cell 6"></div>
      <div class="cell" role="gridcell" tabindex="0" data-index="6" aria-label="Cell 7"></div>
      <div class="cell" role="gridcell" tabindex="0" data-index="7" aria-label="Cell 8"></div>
      <div class="cell" role="gridcell" tabindex="0" data-index="8" aria-label="Cell 9"></div>
    </div>
    <button id="restartBtn" aria-label="Restart Game">Restart Game</button>
  </div>

<script>
  (() => {
    const board = Array(9).fill(null);
    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');
    let currentPlayer = 'X';
    let gameActive = true;

    const winningCombinations = [
      [0,1,2],[3,4,5],[6,7,8], // rows
      [0,3,6],[1,4,7],[2,5,8], // cols
      [0,4,8],[2,4,6]          // diagonals
    ];

    function handleResultValidation() {
      for (const combo of winningCombinations) {
        const [a,b,c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          highlightCells(combo);
          status.textContent = `Player ${board[a]} wins! 🎉`;
          gameActive = false;
          disableBoard();
          return true;
        }
      }
      if (!board.includes(null)) {
        status.textContent = "It's a draw! 🤝";
        gameActive = false;
        return true;
      }
      return false;
    }

    function highlightCells(indices) {
      indices.forEach(i => cells[i].classList.add('highlight'));
    }

    function disableBoard() {
      cells.forEach(cell => cell.classList.add('disabled'));
    }

    function enableBoard() {
      cells.forEach(cell => {
        cell.classList.remove('disabled', 'highlight');
      });
    }

    function updateStatus() {
      status.textContent = `Player ${currentPlayer}'s turn`;
    }

    function handleCellClick(e) {
      const index = e.target.getAttribute('data-index');
      if (!gameActive || board[index]) return;
      board[index] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.add('disabled');
      if (!handleResultValidation()) {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus();
      }
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        e.target.click();
      }
    }

    function restartGame() {
      for(let i=0; i<board.length; i++) board[i] = null;
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('disabled', 'highlight');
      });
      currentPlayer = 'X';
      gameActive = true;
      updateStatus();
      cells[0].focus();
    }

    cells.forEach(cell => {
      cell.addEventListener('click', handleCellClick);
      cell.addEventListener('keydown', handleKeyDown);
    });
    restartBtn.addEventListener('click', restartGame);

    updateStatus();
  })();
</script>
</body>
</html>
